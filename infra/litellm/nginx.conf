limit_req_zone $binary_remote_addr zone=activation_limit:10m rate=10r/m;

# Public test entry point: activation and OpenAI-compatible model APIs only.
server {
    listen 8765;
    server_name _;

    client_max_body_size 10m;

    location /api/v1/activation/ {
        limit_req zone=activation_limit burst=3 nodelay;
        proxy_pass http://control-plane:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 30s;
    }

    location = /api/v1/models {
        proxy_pass http://control-plane:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 30s;
    }

    location = /health/live {
        proxy_pass http://control-plane:8080;
        proxy_set_header Host $host;
    }

    location = /health/ready {
        proxy_pass http://control-plane:8080;
        proxy_set_header Host $host;
    }

    location = /health/liveliness {
        proxy_pass http://litellm:4000;
        proxy_set_header Host $host;
    }

    location /v1/ {
        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}

# Administrator entry point: temporarily published on the host for direct HTTP access.
server {
    listen 8766;
    server_name _;

    client_max_body_size 10m;

    location = / {
        return 302 /admin/;
    }

    location = /admin {
        return 302 /admin/;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store" always;
    }

    location /api/v1/admin/ {
        proxy_pass http://control-plane:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 30s;
    }

    location = /health/live {
        proxy_pass http://control-plane:8080;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
