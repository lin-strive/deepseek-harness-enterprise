name: company-harness-gateway

services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.94.1
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 12

  control-plane:
    build:
      context: ./control-plane
    restart: unless-stopped
    environment:
      CONTROL_PLANE_DATABASE_URL: jdbc:postgresql://postgres:5432/${CONTROL_PLANE_POSTGRES_DB}
      CONTROL_PLANE_POSTGRES_USER: ${CONTROL_PLANE_POSTGRES_USER}
      CONTROL_PLANE_POSTGRES_PASSWORD: ${CONTROL_PLANE_POSTGRES_PASSWORD}
      ACTIVATION_PEPPER: ${ACTIVATION_PEPPER}
      LITELLM_ADMIN_BASE_URL: http://litellm:4000
      LITELLM_PUBLIC_BASE_URL: ${LITELLM_PUBLIC_BASE_URL}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      CNY_PER_USD: ${CNY_PER_USD:-7.2}
      CONTROL_PLANE_ADMIN_USERNAME: ${CONTROL_PLANE_ADMIN_USERNAME:-admin}
      CONTROL_PLANE_ADMIN_PASSWORD: ${CONTROL_PLANE_ADMIN_PASSWORD}
    expose:
      - "8080"
    depends_on:
      litellm:
        condition: service_healthy
      postgres:
        condition: service_healthy

  gateway:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-8765}:8765"
      - "${CONTROL_PLANE_ADMIN_PORT:-8766}:8766"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin-web:/usr/share/nginx/html/admin:ro
    depends_on:
      - control-plane

  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CONTROL_PLANE_POSTGRES_USER: ${CONTROL_PLANE_POSTGRES_USER}
      CONTROL_PLANE_POSTGRES_PASSWORD: ${CONTROL_PLANE_POSTGRES_PASSWORD}
      CONTROL_PLANE_POSTGRES_DB: ${CONTROL_PLANE_POSTGRES_DB}
    volumes:
      - litellm-postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  litellm-postgres:
