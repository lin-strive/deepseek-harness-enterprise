model_list:
  - model_name: deepseek-v4-flash
    litellm_params: &v4_flash
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: os.environ/DEEPSEEK_API_BASE
    model_info: &v4_flash_cost
      input_cost_per_token: 0.00000014
      cache_creation_input_token_cost: 0.00000014
      cache_read_input_token_cost: 0.0000000028
      output_cost_per_token: 0.00000028
  - model_name: deepseek-v4-pro
    litellm_params: &v4_pro
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: os.environ/DEEPSEEK_API_BASE
    model_info: &v4_pro_cost
      input_cost_per_token: 0.000000435
      cache_creation_input_token_cost: 0.000000435
      cache_read_input_token_cost: 0.000000003625
      output_cost_per_token: 0.00000087
  - model_name: deepseek-v4-flash-vision-exp
    litellm_params:
      model: deepseek/deepseek-v4-flash-vision-exp
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: os.environ/DEEPSEEK_API_BASE
    model_info: *v4_flash_cost

  # Temporary compatibility aliases for clients activated before 0.2.0.
  - model_name: company-fast
    litellm_params: *v4_flash
    model_info: *v4_flash_cost
  - model_name: company-coder
    litellm_params: *v4_pro
    model_info: *v4_pro_cost
  - model_name: company-pro
    litellm_params: *v4_pro
    model_info: *v4_pro_cost

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  turn_off_message_logging: true
  redact_messages_in_exceptions: true
  set_verbose: false
  default_key_generate_params:
    models:
      - deepseek-v4-flash
      - deepseek-v4-pro
      - deepseek-v4-flash-vision-exp
      - company-fast
      - company-coder
      - company-pro
    budget_duration: 1mo
  upperbound_key_generate_params:
    max_budget: 10000
    budget_duration: 1mo
    rpm_limit: 600
    tpm_limit: 2000000
    max_parallel_requests: 20

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  cache_kwargs:
    db: os.environ/REDIS_DB
  num_retries: 1
  timeout: 300
